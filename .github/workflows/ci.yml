name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: 검증 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: 소스 받기
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 고정 개발 도구 설치
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2025.12.9"
          # Rust 도구 본체는 mise 캐시 밖의 RUSTUP_HOME에 설치된다.
          # 설치 표시만 복원하면 rustfmt·clippy가 빠지므로 새로 설치한다.
          cache: false
      - name: 공개 파일·문서·모델 검사
        run: mise run repo:check
      - name: 설치 실패·복구 경계 검사
        run: mise run scripts:test
      - name: 워크플로와 비밀정보 검사
        if: runner.os == 'Linux'
        run: |
          mise run workflow:check
          mise run secrets:check
      - name: Rust 포맷·lint·코어·FFI 검사
        if: runner.os != 'Windows'
        run: mise run check
      - name: Windows 코어·TSF x64/x86 연결 검사
        if: runner.os == 'Windows'
        run: mise run windows:check
      - name: macOS 빌드·서명·AppKit 연결 검사
        if: runner.os == 'macOS'
        run: mise run macos:smoke
      - name: 검사한 macOS 번들 패키징
        if: runner.os == 'macOS'
        # 다시 빌드하지 않고 위에서 검사한 번들을 압축한다.
        run: mise exec -- node scripts/package-macos.mjs
      - name: 검사한 Windows 입력기 패키징·설치·제거 검사
        if: runner.os == 'Windows'
        run: mise exec -- node scripts/package-windows.mjs
      - name: Windows Release 패키지 보관
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: dist/release-windows/
          if-no-files-found: error
          retention-days: 14
      - name: Release 패키지 보관
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release 공개
    needs: verify
    if: github.repository == 'TylerShin/amu' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 검사한 커밋 받기
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 고정 개발 도구 설치
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2025.12.9"
          cache: false
      - name: 같은 실행의 검사된 패키지 받기
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-release"
          path: dist/release-input/
      - name: 체크섬 확인 후 개발 릴리스 공개
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- node scripts/publish-release.mjs
