name: 기능·개선 제안
description: 해결하고 싶은 입력 경험과 기대하는 동작을 제안해주세요.
title: "[제안] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 상황에서 불편한가요?
      description: 제안하는 구현보다 실제 입력 상황과 문제를 먼저 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 기대하는 동작
      description: 입력 예시나 전후 동작이 있으면 이해하기 쉬워요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안과 고려할 점
      description: 기존 입력·삭제 동작과 충돌할 수 있는 경우도 알려주세요.
